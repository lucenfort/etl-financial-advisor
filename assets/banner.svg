<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgFinancial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e14" />
      <stop offset="50%" stop-color="#0c1a24" />
      <stop offset="100%" stop-color="#04080c" />
    </linearGradient>

    <linearGradient id="neonGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path -->
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1000" height="250" rx="14" />
    </clipPath>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-8px, 6px); opacity: 0.6; }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1000px); }
    }
    @keyframes spinGear {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes bounceArrow {
      0%, 100% { transform: translateY(-1px); }
      50% { transform: translateY(3px); }
    }

    .orb-green { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 150px 80px; }
    .orb-gold { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 850px 150px; }
    .shimmer-line { animation: shimmerMove 4s linear infinite; }

    .spinning-gear { animation: spinGear 10s linear infinite; transform-origin: 850px 85px; }
    .pipeline-flow { stroke-dasharray: 8, 16; animation: dashFlow 1.2s linear infinite; }
    .load-arrow { animation: bounceArrow 1.5s ease-in-out infinite; }

    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; font-weight: 800; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; font-weight: 400; }
    .mono-text { font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', monospace; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1000" height="250" fill="url(#bgFinancial)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="150" cy="70" r="140" fill="#00FF9D" opacity="0.18" class="orb-green" filter="url(#neonGlow)" />
    <circle cx="850" cy="140" r="160" fill="#FFD700" opacity="0.18" class="orb-gold" filter="url(#neonGlow)" />
    <circle cx="500" cy="30" r="100" fill="#00F0FF" opacity="0.12" class="orb-green" filter="url(#neonGlow)" />

    <!-- Technical Grid Pattern -->
    <g opacity="0.06" stroke="#00FF9D" stroke-width="1">
      <line x1="0" y1="50" x2="1000" y2="50" />
      <line x1="0" y1="100" x2="1000" y2="100" />
      <line x1="0" y1="150" x2="1000" y2="150" />
      <line x1="0" y1="200" x2="1000" y2="200" />
      <line x1="100" y1="0" x2="100" y2="250" />
      <line x1="250" y1="0" x2="250" y2="250" />
      <line x1="400" y1="0" x2="400" y2="250" />
      <line x1="550" y1="0" x2="550" y2="250" />
      <line x1="700" y1="0" x2="700" y2="250" />
      <line x1="850" y1="0" x2="850" y2="250" />
    </g>

    <!-- Animated 3-Stage ETL Flow System on Right -->
    <g opacity="0.9" transform="translate(680, 20)">
      <!-- Pipeline Connector Lines -->
      <path d="M 50,85 L 130,85" stroke="#132a24" stroke-width="3" stroke-linecap="round" />
      <path d="M 50,85 L 130,85" stroke="url(#primary-grad)" stroke-width="3" stroke-linecap="round" class="pipeline-flow" />

      <path d="M 170,85 L 250,85" stroke="#132a24" stroke-width="3" stroke-linecap="round" />
      <path d="M 170,85 L 250,85" stroke="url(#accent-grad)" stroke-width="3" stroke-linecap="round" class="pipeline-flow" />

      <!-- Stage 1: EXTRACT (Database) -->
      <g transform="translate(30, 85)">
        <circle cx="0" cy="0" r="24" fill="#09181c" stroke="#00FF9D" stroke-width="1.8" filter="url(#softGlow)" />
        <g transform="translate(-10, -10)" stroke="#00FF9D" stroke-width="1.6" fill="none">
          <ellipse cx="10" cy="5" rx="7" ry="2.5" />
          <path d="M 3,5 L 3,10 A 7,2.5 0 0 0 17,10 L 17,5" />
          <path d="M 3,10 L 3,15 A 7,2.5 0 0 0 17,15 L 17,10" />
        </g>
        <text x="0" y="38" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">EXTRACT</text>
      </g>

      <!-- Stage 2: TRANSFORM (Spinning Gear / Logic) -->
      <g transform="translate(150, 85)">
        <circle cx="0" cy="0" r="26" fill="#141c10" stroke="#FFD700" stroke-width="2" filter="url(#softGlow)" />
        <!-- Gear -->
        <g transform="translate(-8, -8)" stroke="#FFD700" stroke-width="1.6" fill="none">
          <circle cx="8" cy="8" r="4" />
          <path d="M8,2 L8,4 M8,12 L8,14 M2,8 L4,8 M12,8 L14,8 M3.5,3.5 L5,5 M11,11 L12.5,12.5 M3.5,12.5 L5,11 M11,5 L12.5,3.5" />
        </g>
        <text x="0" y="40" fill="#FFD700" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">TRANSFORM</text>
      </g>

      <!-- Stage 3: LOAD (JSON / Enriched CSV) -->
      <g transform="translate(270, 85)">
        <circle cx="0" cy="0" r="24" fill="#09181c" stroke="#00F0FF" stroke-width="1.8" filter="url(#softGlow)" />
        <g transform="translate(-9, -8)" stroke="#00F0FF" stroke-width="1.6" fill="none">
          <path d="M 15 13 a 1.5 1.5 0 0 1 -1.5 1.5 H 3 a 1.5 1.5 0 0 1 -1.5 -1.5 V 3 a 1.5 1.5 0 0 1 1.5 -1.5 h 4 l 1.5 2 h 5 a 1.5 1.5 0 0 1 1.5 1.5 z" />
          <g class="load-arrow">
            <path d="M 8 7 v 4 M 6 9 l 2 2 2 -2" />
          </g>
        </g>
        <text x="0" y="38" fill="#94A3B8" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">LOAD</text>
      </g>
    </g>

    <!-- Top Glow Accent Line with Shimmer -->
    <rect x="0" y="0" width="1000" height="3" fill="url(#neonGoldGrad)" />
    <rect x="0" y="0" width="250" height="3" fill="url(#shimmerGrad)" class="shimmer-line" />

    <!-- Top Badge / Header Tag -->
    <g transform="translate(60, 36)">
      <rect x="0" y="0" width="340" height="26" rx="13" fill="#0c201c" stroke="#00FF9D" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="13" cy="13" r="4.5" fill="#00FF9D" filter="url(#softGlow)" />
      <text x="26" y="17" fill="#E2E8F0" font-size="11" class="title-text" letter-spacing="1">
        DATA PIPELINE &amp; FINANCIAL AI
      </text>
    </g>

    <!-- Main Title: ETL FINANCIAL ADVISOR -->
    <g transform="translate(60, 108)">
      <!-- Financial Trend Chart Icon -->
      <g transform="translate(0, -32) scale(0.95)">
        <path d="M4 24 L10 16 L18 20 L28 8 M28 8 L22 8 M28 8 L28 14" 
              fill="none" stroke="#00FF9D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
      </g>
      
      <text x="50" y="5" fill="#FFFFFF" font-size="40" class="title-text" letter-spacing="1.5">
        ETL FINANCIAL
      </text>
      <text x="400" y="5" fill="#00FF9D" font-size="40" class="title-text" letter-spacing="1.5" filter="url(#softGlow)">
        ADVISOR
      </text>
    </g>

    <!-- Subtitle -->
    <text x="60" y="148" fill="#94A3B8" font-size="15" class="body-text" letter-spacing="0.5">
      Pipeline de Dados Modular, Categorização Inteligente &amp; Simulação Preditiva de Rendimentos
    </text>

    <!-- Bottom Status Badges Row -->
    <g transform="translate(60, 180)">
      <rect x="0" y="0" width="700" height="34" rx="8" fill="#081412" stroke="#122c24" stroke-width="1" opacity="0.9" />
      
      <!-- Feature Pills -->
      <g transform="translate(20, 21)">
        <circle cx="0" cy="-3" r="4" fill="#00FF9D" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Python 3.x</text>
      </g>
      
      <g transform="translate(135, 21)">
        <circle cx="0" cy="-3" r="4" fill="#00F0FF" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Pandas ETL Core</text>
      </g>

      <g transform="translate(300, 21)">
        <circle cx="0" cy="-3" r="4" fill="#FFD700" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Kaggle Bank Data</text>
      </g>

      <g transform="translate(470, 21)">
        <circle cx="0" cy="-3" r="4" fill="#FF007F" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Selic Yield Engine (10.5% a.a.)</text>
      </g>
    </g>

    <!-- Subtle Border Around Banner -->
    <rect x="0" y="0" width="1000" height="250" rx="14" fill="none" stroke="#00FF9D" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
